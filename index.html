<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-build" content="2026-05-10T22:00Z" />
    <title>EVORIA — Plataforma de Transformação Inteligente</title>
    <meta name="description" content="EVORIA é a plataforma premium de transformação física com inteligência artificial. Treino, dieta e evolução desenhados com método e precisão.">
    <meta name="author" content="EVORIA" />
    <meta name="theme-color" content="#00C4B3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="EVORIA — Plataforma de Transformação Inteligente">
    <meta property="og:description" content="Sistema premium de transformação física com IA. Método, estrutura e clareza para uma evolução real.">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVORIA — Plataforma de Transformação Inteligente">
    <meta name="twitter:description" content="Sistema premium de transformação física com IA. Método, estrutura e clareza.">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Auto-update: força clientes antigos a buscar a versão mais recente.
      // Funciona mesmo quando o index.html veio do cache do navegador.
      (function () {
        try {
          var BUILD = '2026-05-10T22:00Z';
          var RELOAD_KEY = 'evoria_force_reload_done';

          // Sempre tenta desregistrar SWs legados (não interfere no sw-push.js)
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                var url = (r.active && r.active.scriptURL) || '';
                if (url.indexOf('sw-push.js') === -1) r.unregister();
              });
            }).catch(function () {});
          }

          function clearAllCaches() {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {});
            }
            return Promise.resolve();
          }

          // Compara o BUILD embutido neste HTML com o /version.json servido pela rede.
          // Se diferentes => este index.html está em cache antigo. Limpa tudo e recarrega.
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.buildId) return;
              if (data.buildId !== BUILD) {
                // Evita loop: só recarrega uma vez por sessão
                if (sessionStorage.getItem(RELOAD_KEY) === data.buildId) return;
                sessionStorage.setItem(RELOAD_KEY, data.buildId);
                clearAllCaches().finally(function () {
                  // location.reload(true) é deprecado mas força bypass em browsers antigos
                  window.location.replace(window.location.pathname + '?v=' + Date.now() + window.location.hash);
                });
              } else {
                sessionStorage.removeItem(RELOAD_KEY);
                localStorage.setItem('evoria_build', BUILD);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
