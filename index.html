    <title>EVORIA — Plataforma de Transformação Inteligente</title>
    <meta name="description" content="EVORIA é a plataforma premium de transformação física com inteligência artificial. Treino, dieta e evolução desenhados com método e precisão.">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="EVORIA — Plataforma de Transformação Inteligente">
    <meta property="og:description" content="Sistema premium de transformação física com IA. Método, estrutura e clareza para uma evolução real.">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVORIA — Plataforma de Transformação Inteligente">
    <meta name="twitter:description" content="Sistema premium de transformação física com IA. Método, estrutura e clareza.">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Force-update legacy clients: unregister any existing SW and clear caches once per build
      (function () {
        try {
          var BUILD = '2026-05-10T22:00Z';
          var seen = localStorage.getItem('evoria_build');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (seen !== BUILD) {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {});
            }
            localStorage.setItem('evoria_build', BUILD);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
